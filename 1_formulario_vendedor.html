<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consolidado Equipo — Gerencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --blue-50:#E6F1FB;--blue-200:#85B7EB;--blue-400:#378ADD;--blue-600:#185FA5;--blue-800:#0C447C;--blue-900:#042C53;
  --green-50:#EAF3DE;--green-400:#639922;--green-600:#3B6D11;--green-800:#27500A;
  --amber-50:#FAEEDA;--amber-400:#BA7517;--amber-800:#633806;
  --red-50:#FCEBEB;--red-400:#E24B4A;--red-800:#791F1F;
  --gray-50:#F1EFE8;--gray-200:#B4B2A9;
  --text:#1a1a1a;--text-muted:#6b6b6b;--text-hint:#9b9b9b;
  --bg:#ffffff;--bg-surface:#f7f7f5;--border:rgba(0,0,0,0.1);
  --radius:10px;--radius-lg:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg-surface);color:var(--text);min-height:100vh}
.shell{max-width:1000px;margin:0 auto;padding:2rem 1.25rem 4rem}
.page-header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border);flex-wrap:wrap}
.header-left{display:flex;align-items:center;gap:14px}
.logo-mark{width:40px;height:40px;background:var(--blue-600);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-mark i{font-size:20px;color:#fff}
.page-title{font-size:17px;font-weight:600}
.page-sub{font-size:13px;color:var(--text-muted);margin-top:2px}
.header-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;transition:background .15s,transform .1s}
.btn:hover{background:var(--bg-surface)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--blue-600);color:#fff;border-color:var(--blue-600)}
.btn-primary:hover{background:var(--blue-800);border-color:var(--blue-800)}
select.ctrl{font-family:'Inter',sans-serif;font-size:13px;padding:8px 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg);color:var(--text)}
.status-dot{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted)}
.dot-live{width:8px;height:8px;border-radius:50%;background:var(--green-400);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Summary cards */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:2rem}
.summary-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:1rem}
.s-num{font-family:'DM Mono',monospace;font-size:24px;font-weight:500;color:var(--text);margin-bottom:2px}
.s-label{font-size:11px;color:var(--text-muted)}
.s-sub{font-size:10px;color:var(--text-hint);margin-top:3px}

/* Team table */
.section-title{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-hint);margin:1.75rem 0 .75rem;display:flex;align-items:center;gap:6px}
.table-wrap{overflow-x:auto;border-radius:var(--radius-lg);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--bg)}
thead tr{border-bottom:1px solid var(--border)}
th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--text-muted);white-space:nowrap;background:var(--bg-surface)}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--bg-surface)}
td{padding:10px 14px;white-space:nowrap}
td.mono{font-family:'DM Mono',monospace;font-size:12px}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500}
.badge-ok{background:var(--green-50);color:var(--green-800)}
.badge-warn{background:var(--amber-50);color:var(--amber-800)}
.badge-danger{background:var(--red-50);color:var(--red-800)}

/* Bar chart */
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:2rem}
.chart-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem}
.chart-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:1rem}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bar-name{font-size:12px;color:var(--text-muted);width:90px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;background:var(--bg-surface);border-radius:4px;height:22px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding:0 8px;min-width:30px;transition:width .6s ease}
.bar-fill span{font-size:11px;font-weight:500;white-space:nowrap}

/* Obstacles */
.obstacle-list{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.obstacle-row{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:start;padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px}
.obstacle-row:last-child{border-bottom:none}
.obstacle-name{font-weight:500;color:var(--text)}
.obstacle-text{color:var(--text-muted);line-height:1.4}
.obstacle-commit{font-size:12px;color:var(--blue-800);background:var(--blue-50);padding:4px 10px;border-radius:20px;white-space:nowrap}

/* Empty / loading */
.empty-state{text-align:center;padding:4rem 2rem;color:var(--text-muted)}
.empty-state i{font-size:40px;color:var(--gray-200);margin-bottom:1rem;display:block}
.empty-state p{font-size:14px}
.loading{text-align:center;padding:3rem;color:var(--text-hint);font-size:14px}

@media(max-width:640px){.chart-grid{grid-template-columns:1fr}.obstacle-row{grid-template-columns:1fr;gap:6px}}
@media print{.header-controls,.btn{display:none!important}body{background:#fff}.shell{padding:1rem;max-width:100%}}
</style>
</head>
<body>
<div class="shell">
  <header class="page-header">
    <div class="header-left">
      <div class="logo-mark"><i class="ti ti-layout-dashboard"></i></div>
      <div>
        <p class="page-title">Consolidado del equipo — Gerencia</p>
        <p class="page-sub">Vista en tiempo real &nbsp;·&nbsp; <span class="status-dot"><span class="dot-live"></span><span id="last-update">cargando...</span></span></p>
      </div>
    </div>
    <div class="header-controls">
      <select class="ctrl" id="mes-filter" onchange="filtrarMes()"><option value="">— Todos los meses —</option></select>
      <button class="btn" onclick="cargarDatos()"><i class="ti ti-refresh"></i> Actualizar</button>
      <button class="btn" onclick="window.print()"><i class="ti ti-printer"></i> Imprimir</button>
    </div>
  </header>

  <div id="main-content"><div class="loading"><i class="ti ti-loader" style="font-size:24px;display:block;margin-bottom:8px"></i>Cargando datos del equipo...</div></div>
</div>

<script>
const APPS_SCRIPT_URL = https://script.google.com/a/macros/extruidos.com/s/AKfycbwMD1qR_wwgVU-61qEJayzlpEbkvpi2ckHd49CPIzsn0Lc7JjSiPRBE5Ft2CC7EKRQi/exec'https://script.google.com/a/macros/extruidos.com/s/AKfycbwMD1qR_wwgVU-61qEJayzlpEbkvpi2ckHd49CPIzsn0Lc7JjSiPRBE5Ft2CC7EKRQi/exec';
let todosLosDatos = [];
let mesActivo = '';

async function cargarDatos(){
  document.getElementById('last-update').textContent = 'actualizando...';
  if(APPS_SCRIPT_URL === 'PEGA_TU_URL_AQUI'){
    renderDemo();
    return;
  }
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?t=' + Date.now());
    const json = await res.json();
    if(json.success && json.data){
      todosLosDatos = json.data;
      actualizarFiltroMes();
      renderDashboard();
      document.getElementById('last-update').textContent = 'actualizado ' + new Date().toLocaleTimeString('es-MX');
    }
  } catch(e){
    renderDemo();
  }
}

function actualizarFiltroMes(){
  const meses = [...new Set(todosLosDatos.map(d=>d.mes).filter(Boolean))].sort().reverse();
  const sel = document.getElementById('mes-filter');
  const current = sel.value;
  sel.innerHTML = '<option value="">— Todos los meses —</option>' +
    meses.map(m=>`<option value="${m}" ${m===current?'selected':''}>${fmtMes(m)}</option>`).join('');
}

function filtrarMes(){
  mesActivo = document.getElementById('mes-filter').value;
  renderDashboard();
}

function fmtMes(m){
  if(!m) return '—';
  return new Date(m+'-02').toLocaleDateString('es-MX',{year:'numeric',month:'long'});
}

function getDatos(){
  if(!mesActivo) return todosLosDatos;
  return todosLosDatos.filter(d=>d.mes===mesActivo);
}

function num(v){ return parseFloat(v)||0; }

function renderDashboard(){
  const datos = getDatos();
  if(!datos.length){
    document.getElementById('main-content').innerHTML=`<div class="empty-state"><i class="ti ti-users"></i><p>Aún no hay datos para el filtro seleccionado.<br>Comparte el formulario con tu equipo.</p></div>`;
    return;
  }

  // Tomar la entrada más reciente por vendedor
  const porVendedor = {};
  datos.forEach(d=>{
    const key = d.nombre+'|'+d.mes;
    if(!porVendedor[key] || d.timestamp > porVendedor[key].timestamp) porVendedor[key]=d;
  });
  const rows = Object.values(porVendedor);

  // Promedios
  const avg = k => rows.length ? Math.round(rows.reduce((s,r)=>s+num(r[k]),0)/rows.length) : 0;
  const sum = k => rows.reduce((s,r)=>s+num(r[k]),0);

  const avgBateo = avg('bateo');
  const avgCiclo = avg('kpi4');
  const avgRecompra = avg('recompra');
  const totalCierres = sum('cierres');
  const totalVenta = sum('venta_total');
  const pendientes = rows.filter(r=>num(r.bateo)<20).length;

  // Semáforo
  const sf = (v,ok,warn) => v>=ok?'ok':v>=warn?'warn':'danger';
  const badge = (tipo,txt) => `<span class="badge badge-${tipo}">${txt}</span>`;

  // Tabla
  const tablaRows = rows.sort((a,b)=>num(b.bateo)-num(a.bateo)).map(r=>{
    const bTipo=sf(num(r.bateo),35,20);
    const cTipo=num(r.kpi4)<=30?'ok':num(r.kpi4)<=45?'warn':'danger';
    const rTipo=sf(num(r.recompra),50,30);
    return `<tr>
      <td style="font-weight:500">${r.nombre}</td>
      <td>${fmtMes(r.mes)}</td>
      <td class="mono">${num(r.tofu)}</td>
      <td class="mono">${num(r.mofu)}</td>
      <td class="mono">${num(r.bofu)}</td>
      <td class="mono">${num(r.cierres)}</td>
      <td>${badge(bTipo,num(r.bateo)+'%')}</td>
      <td class="mono">$${num(r.ticket).toLocaleString('es-MX')}</td>
      <td>${badge(cTipo,num(r.kpi4)+'d')}</td>
      <td>${badge(rTipo,num(r.recompra)+'%')}</td>
    </tr>`;
  }).join('');

  // Barras de bateo
  const maxBateo = Math.max(...rows.map(r=>num(r.bateo)),1);
  const barsHtml = rows.sort((a,b)=>num(b.bateo)-num(a.bateo)).map(r=>{
    const v=num(r.bateo);
    const w=Math.round((v/maxBateo)*100);
    const color=v>=35?'#639922':v>=20?'#BA7517':'#E24B4A';
    const tc=v>=35?'#27500A':v>=20?'#633806':'#791F1F';
    return `<div class="bar-row">
      <span class="bar-name" title="${r.nombre}">${r.nombre}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${color}"><span style="color:${tc}">${v}%</span></div></div>
    </div>`;
  }).join('');

  // Barras de ticket
  const maxTicket = Math.max(...rows.map(r=>num(r.ticket)),1);
  const ticketBars = rows.sort((a,b)=>num(b.ticket)-num(a.ticket)).map(r=>{
    const v=num(r.ticket);
    const w=Math.round((v/maxTicket)*100);
    return `<div class="bar-row">
      <span class="bar-name" title="${r.nombre}">${r.nombre}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:#378ADD"><span style="color:#042C53">$${v.toLocaleString('es-MX')}</span></div></div>
    </div>`;
  }).join('');

  // Obstáculos y compromisos
  const obstHtml = rows.map(r=>`<div class="obstacle-row">
    <span class="obstacle-name">${r.nombre}</span>
    <span class="obstacle-text">${r.obstaculo||'—'}${r.detalle?'<br><span style="font-size:11px;color:var(--text-hint)">'+r.detalle+'</span>':''}</span>
    <span class="obstacle-commit">${r.kpi_mejorar||'—'}</span>
  </div>`).join('');

  document.getElementById('main-content').innerHTML=`
    <div class="summary-grid">
      <div class="summary-card"><p class="s-num">${rows.length}</p><p class="s-label">Vendedores reportados</p><p class="s-sub">de tu equipo</p></div>
      <div class="summary-card"><p class="s-num">${avgBateo}%</p><p class="s-label">Bateo promedio</p><p class="s-sub">cierres vs cotizaciones</p></div>
      <div class="summary-card"><p class="s-num">${totalCierres}</p><p class="s-label">Cierres totales</p><p class="s-sub">suma del equipo</p></div>
      <div class="summary-card"><p class="s-num">$${Math.round(totalVenta/1000).toLocaleString('es-MX')}K</p><p class="s-label">Venta total</p><p class="s-sub">suma del equipo</p></div>
      <div class="summary-card"><p class="s-num">${avgCiclo}d</p><p class="s-label">Ciclo promedio</p><p class="s-sub">días para cerrar</p></div>
      <div class="summary-card"><p class="s-num">${avgRecompra}%</p><p class="s-label">Recompra prom.</p><p class="s-sub">retención</p></div>
      ${pendientes>0?`<div class="summary-card" style="border-color:rgba(226,75,74,.3)"><p class="s-num" style="color:#E24B4A">${pendientes}</p><p class="s-label">Bateo crítico</p><p class="s-sub">menos del 20%</p></div>`:''}
    </div>

    <p class="section-title"><i class="ti ti-table"></i> Detalle por vendedor</p>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Vendedor</th><th>Mes</th><th>ToFu</th><th>MoFu</th><th>BoFu</th><th>Cierres</th>
          <th>Bateo</th><th>Ticket</th><th>Ciclo</th><th>Recompra</th>
        </tr></thead>
        <tbody>${tablaRows}</tbody>
      </table>
    </div>

    <div class="chart-grid" style="margin-top:2rem">
      <div class="chart-card"><p class="chart-title"><i class="ti ti-target" style="font-size:14px;vertical-align:-2px;margin-right:4px"></i>Bateo por vendedor</p>${barsHtml}</div>
      <div class="chart-card"><p class="chart-title"><i class="ti ti-coin" style="font-size:14px;vertical-align:-2px;margin-right:4px"></i>Ticket promedio</p>${ticketBars}</div>
    </div>

    <p class="section-title"><i class="ti ti-bulb"></i> Obstáculos y compromisos del equipo</p>
    <div class="obstacle-list">${obstHtml}</div>
  `;
}

function renderDemo(){
  todosLosDatos = [
    {nombre:'Ana Torres',mes:'2025-06',tofu:85,mofu:32,bofu:18,cierres:6,bateo:33,ticket:18500,kpi4:24,recompra:55,kpi1:22,venta_total:111000,kpi5_rep:11,kpi5_total:20,perdida:'En la cotización (precio)',obstaculo:'Competencia por precio',detalle:'',compromiso:'Llamar a los 4 prospectos sin respuesta antes del día 5',kpi_mejorar:'Ticket promedio',timestamp:'2025-06-09'},
    {nombre:'Carlos Mendoza',mes:'2025-06',tofu:60,mofu:20,bofu:12,cierres:2,bateo:17,ticket:22000,kpi4:38,recompra:30,kpi1:15,venta_total:44000,kpi5_rep:6,kpi5_total:20,perdida:'Después de la presentación (sin seguimiento)',obstaculo:'Falta de seguimiento después de prueba técnica',detalle:'Se agendaron 8 pruebas y solo 2 recibieron seguimiento formal',compromiso:'Crear agenda semanal de seguimiento post-prueba los viernes',kpi_mejorar:'Conversión cotización a cierre',timestamp:'2025-06-09'},
    {nombre:'Sofía Ruiz',mes:'2025-06',tofu:72,mofu:28,bofu:15,cierres:7,bateo:47,ticket:15800,kpi4:19,recompra:65,kpi1:30,venta_total:110600,kpi5_rep:13,kpi5_total:20,perdida:'En el primer contacto (no quiso agendar)',obstaculo:'Poco volumen de prospectos nuevos',detalle:'',compromiso:'Activar 2 referidos por cada cierre logrado',kpi_mejorar:'Velocidad de prospección',timestamp:'2025-06-09'},
    {nombre:'Miguel Vargas',mes:'2025-06',tofu:50,mofu:18,bofu:10,cierres:3,bateo:30,ticket:19200,kpi4:31,recompra:40,kpi1:18,venta_total:57600,kpi5_rep:8,kpi5_total:20,perdida:'En negociación (competencia o decisión interna)',obstaculo:'Ciclo de decisión muy largo en el cliente',detalle:'',compromiso:'Agregar resumen ejecutivo a cada cotización',kpi_mejorar:'Ciclo de venta (días)',timestamp:'2025-06-09'}
  ];
  actualizarFiltroMes();
  document.getElementById('mes-filter').value='2025-06';
  mesActivo='2025-06';
  renderDashboard();
  document.getElementById('last-update').textContent='modo demo — conecta tu Sheet para datos reales';
}

// Actualizar automáticamente cada 30 segundos
setInterval(()=>{ if(APPS_SCRIPT_URL!=='PEGA_TU_URL_AQUI') cargarDatos(); }, 30000);
cargarDatos();
</script>
</body>
</html>
